<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lector SKU</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f9fc;background:#101a2a}*{box-sizing:border-box}body{margin:0;padding:16px}.app{max-width:440px;margin:auto}.tag{color:#f5b82e;font-size:12px;letter-spacing:2px;font-weight:800}h1{font-size:21px;line-height:1.25;margin:10px 0 6px}p{color:#cbd5e1;font-size:13px;line-height:1.45;margin:8px 0 12px}#reader{background:#172337;border:1px solid #334155;border-radius:14px;overflow:hidden;min-height:0;width:100%}#reader video{max-height:260px;object-fit:cover}#reader__dashboard{padding:6px!important}#status{font-size:13px;line-height:1.5;min-height:42px;margin:10px 0;color:#e5edf8}.actions{display:flex;gap:8px}button{border:0;border-radius:10px;background:#f5b82e;color:#142033;font-size:14px;font-weight:800;padding:13px 14px;cursor:pointer;flex:1}.secondary{background:#26354b;color:#fff}#result{display:none;background:#1c3045;border:1px solid #41617d;border-radius:12px;padding:14px;margin:12px 0;word-break:break-all}#code{font:800 23px ui-monospace,monospace;color:#f5b82e}small{color:#9fb0c5;font-size:11px;display:block;margin-top:14px}
</style>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><main class="app"><div class="tag">ALMACÉN · SKU</div><h1>📷 Escanear código de barras</h1><p>Coloca el código dentro del visor. Se leerá automáticamente.</p><div id="reader"></div><div id="status" role="status">Preparando lector…</div><div id="result"><div>Código detectado</div><div id="code"></div><button type="button" onclick="copiar()">Copiar código</button></div><div class="actions"><button type="button" onclick="iniciar()">↻ Reintentar</button><button type="button" class="secondary" onclick="location.href=retornoSeguro()?.href||'https://evidenciaspisa-netizen.github.io/sku-lector/'">Volver</button></div><small>EAN-8, EAN-13, UPC-A, UPC-E, Code 128, Code 39 e ITF · HTTPS requerido</small></main>
<script>
const params=new URLSearchParams(location.search),ret=params.get('returnUrl'),dest=params.get('destino')==='registro'?'registro':'consulta';
const statusEl=document.getElementById('status');let scanner=null,busy=false,ultimo='';
function retornoSeguro(){try{const u=new URL(ret);return u.protocol==='https:'&&u.hostname==='script.google.com'&&/^\/macros\/s\/[^/]+\/exec\/?$/.test(u.pathname)?u:null}catch{return null}}
async function copiar(){try{await navigator.clipboard.writeText(ultimo);statusEl.textContent='Código copiado. Puedes pegarlo en el formulario.'}catch{statusEl.textContent='Selecciona y copia el código mostrado.'}}
async function iniciar(){
 busy=false;document.getElementById('result').style.display='none';
 if(typeof Html5Qrcode==='undefined'){statusEl.textContent='No se cargó la librería del lector. Comprueba tu conexión a Internet.';return}
 if(scanner){try{if(scanner.isScanning)await scanner.stop();scanner.clear()}catch(e){}}
 scanner=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF],verbose:false});
 statusEl.textContent='Solicitando permiso para la cámara…';
 try{await scanner.start({facingMode:'environment'},{fps:12,aspectRatio:1.7778,qrbox:(w,h)=>({width:Math.min(w-20,350),height:Math.min(Math.max(75,h*.35),120)})},async code=>{
 if(busy)return;const value=String(code).trim();if(!/^\d{8,14}$/.test(value)){statusEl.textContent='Se detectó un código incompatible. Intenta con un EAN numérico.';return}
 busy=true;ultimo=value;document.getElementById('code').textContent=value;document.getElementById('result').style.display='block';
 statusEl.textContent='¡Código leído correctamente!';try{await scanner.stop()}catch(e){}
 const url=retornoSeguro();if(url){url.searchParams.set('ean',value);url.searchParams.set('destino',dest);statusEl.textContent='¡Código leído! Regresando a SKUs…';location.replace(url.toString())}
 },()=>{});statusEl.textContent=retornoSeguro()?'Cámara lista. Enfoca el código.':'Modo de prueba: escanea aquí; para regresar automáticamente, abre la cámara desde la app de SKUs.'}
 catch(e){statusEl.textContent='No se pudo abrir la cámara: '+(e?.message||e)+'. Verifica permisos en el navegador y prueba Reintentar.'}
}
window.addEventListener('load',iniciar);
</script></body></html>
